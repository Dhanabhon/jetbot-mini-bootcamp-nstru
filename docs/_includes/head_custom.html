<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<meta name="theme-color" content="#fbfbf8">
<script>
  /* Set the Windows/macOS choice before first paint so the other OS's steps never flash in.
     Use block comments only: the theme minifies the page onto one line, so a // comment would swallow the code. */
  (function () {
    var root = document.documentElement;
    var platform = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
    var detected = /mac|iphone|ipad/i.test(platform) ? "mac" : "windows";
    var stored = null;
    try { stored = localStorage.getItem("os"); } catch (e) {}
    root.dataset.osDetected = detected;
    root.dataset.os = stored === "windows" || stored === "mac" ? stored : detected;
  })();
</script>
<script src="{{ '/assets/js/os-switch.js' | relative_url }}" defer></script>
